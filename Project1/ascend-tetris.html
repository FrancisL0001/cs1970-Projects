<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCEND - Anti-Gravity Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0a0a1f 0%, #1a0a2e 50%, #16001e 100%);
            color: #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50px); }
        }

        .container {
            background: rgba(10, 10, 31, 0.8);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 90vw;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .game-area {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .game-board {
            position: relative;
        }

        canvas {
            border: 3px solid #ff00ff;
            border-radius: 10px;
            box-shadow:
                0 0 30px rgba(255, 0, 255, 0.6),
                inset 0 0 20px rgba(255, 0, 255, 0.1);
            background: rgba(0, 0, 0, 0.6);
            display: block;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .info-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #ff00ff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1rem;
            padding: 5px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 5px;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
        }

        #nextPieceCanvas {
            border: 2px solid #ff00ff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            background: rgba(0, 0, 0, 0.6);
            display: block;
            margin: 10px auto;
        }

        .controls {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .controls h3 {
            color: #ff00ff;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1rem;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 0.85rem;
            padding: 5px;
        }

        .key {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #0a0a1f;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        button {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #0a0a1f;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
            margin: 10px auto;
            display: block;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 31, 0.95);
            border: 3px solid #ff00ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.8);
            display: none;
            z-index: 10;
        }

        .game-over.show {
            display: block;
            animation: popup 0.3s ease;
        }

        @keyframes popup {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .game-over h2 {
            font-size: 2rem;
            color: #ff00ff;
            margin-bottom: 15px;
        }

        .game-over p {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬆ ASCEND ⬆</h1>

        <div class="game-area">
            <div class="game-board">
                <canvas id="gameCanvas"></canvas>
                <div class="game-over" id="gameOver">
                    <h2>SYSTEM FAILURE</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <p>Level Reached: <span id="finalLevel">1</span></p>
                    <button onclick="game.restart()">REBOOT SYSTEM</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="info-panel">
                    <h2>Stats</h2>
                    <div class="stat">
                        <span>Score:</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat">
                        <span>Level:</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                    <div class="stat">
                        <span>Lines:</span>
                        <span class="stat-value" id="lines">0</span>
                    </div>
                </div>

                <div class="info-panel">
                    <h2>Next Block</h2>
                    <canvas id="nextPieceCanvas"></canvas>
                </div>

                <div class="controls">
                    <h3>CONTROLS</h3>
                    <div class="control-item">
                        <span>Move Left:</span>
                        <span class="key">←</span>
                    </div>
                    <div class="control-item">
                        <span>Move Right:</span>
                        <span class="key">→</span>
                    </div>
                    <div class="control-item">
                        <span>Rotate:</span>
                        <span class="key">↑</span>
                    </div>
                    <div class="control-item">
                        <span>Speed Up:</span>
                        <span class="key">↓</span>
                    </div>
                    <div class="control-item">
                        <span>Hard Rise:</span>
                        <span class="key">SPACE</span>
                    </div>
                    <div class="control-item">
                        <span>Pause:</span>
                        <span class="key">P</span>
                    </div>
                </div>

                <button onclick="game.togglePause()">PAUSE</button>
            </div>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = Math.min(window.innerWidth / (COLS * 1.5), 30);

        const SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]], // Z
            [[1, 0, 0], [1, 1, 1]], // J
            [[0, 0, 1], [1, 1, 1]]  // L
        ];

        const COLORS = [
            '#00ffff', '#ffff00', '#ff00ff', '#00ff00',
            '#ff0000', '#0000ff', '#ff8800'
        ];

        class Tetromino {
            constructor(shape, color) {
                this.shape = shape;
                this.color = color;
                this.x = Math.floor(COLS / 2) - Math.floor(shape[0].length / 2);
                this.y = ROWS - 1; // Start at bottom for anti-gravity
            }

            draw(ctx, offsetX = 0, offsetY = 0, blockSize = BLOCK_SIZE) {
                this.shape.forEach((row, dy) => {
                    row.forEach((value, dx) => {
                        if (value) {
                            const drawX = (this.x + dx) * blockSize + offsetX;
                            const drawY = (this.y - dy) * blockSize + offsetY;

                            ctx.shadowBlur = 15;
                            ctx.shadowColor = this.color;
                            ctx.fillStyle = this.color;
                            ctx.fillRect(drawX + 1, drawY + 1, blockSize - 2, blockSize - 2);

                            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                            ctx.fillRect(
                                drawX + blockSize * 0.25,
                                drawY + blockSize * 0.25,
                                blockSize * 0.5,
                                blockSize * 0.5
                            );
                            ctx.shadowBlur = 0;
                        }
                    });
                });
            }

            rotate() {
                const newShape = this.shape[0].map((_, i) =>
                    this.shape.map(row => row[i]).reverse()
                );
                const oldShape = this.shape;
                this.shape = newShape;

                if (this.collides(game.board)) {
                    this.shape = oldShape;
                    return false;
                }
                return true;
            }

            move(dir, board) {
                this.x += dir;
                if (this.collides(board)) {
                    this.x -= dir;
                    return false;
                }
                return true;
            }

            moveUp(board) {
                this.y -= 1;
                if (this.collides(board)) {
                    this.y += 1;
                    return false;
                }
                return true;
            }

            collides(board) {
                for (let dy = 0; dy < this.shape.length; dy++) {
                    for (let dx = 0; dx < this.shape[dy].length; dx++) {
                        if (this.shape[dy][dx]) {
                            const boardX = this.x + dx;
                            const boardY = this.y - dy;

                            if (boardX < 0 || boardX >= COLS || boardY < 0 || boardY >= ROWS) {
                                return true;
                            }

                            if (board[boardY][boardX]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.nextCanvas = document.getElementById('nextPieceCanvas');
                this.nextCtx = this.nextCanvas.getContext('2d');

                this.canvas.width = COLS * BLOCK_SIZE;
                this.canvas.height = ROWS * BLOCK_SIZE;
                this.nextCanvas.width = 4 * BLOCK_SIZE;
                this.nextCanvas.height = 4 * BLOCK_SIZE;

                this.reset();
                this.setupControls();
            }

            reset() {
                this.board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.gameOver = false;
                this.isPaused = false;
                this.dropCounter = 0;
                this.dropInterval = 1000;
                this.lastTime = 0;

                this.currentPiece = this.createPiece();
                this.nextPiece = this.createPiece();

                this.updateStats();
                this.drawNextPiece();
                document.getElementById('gameOver').classList.remove('show');
            }

            createPiece() {
                const index = Math.floor(Math.random() * SHAPES.length);
                return new Tetromino(SHAPES[index], COLORS[index]);
            }

            drawBoard() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid
                this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= COLS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * BLOCK_SIZE, 0);
                    this.ctx.lineTo(i * BLOCK_SIZE, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * BLOCK_SIZE);
                    this.ctx.lineTo(this.canvas.width, i * BLOCK_SIZE);
                    this.ctx.stroke();
                }

                // Draw placed blocks
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (this.board[y][x]) {
                            const color = this.board[y][x];
                            this.ctx.shadowBlur = 15;
                            this.ctx.shadowColor = color;
                            this.ctx.fillStyle = color;
                            this.ctx.fillRect(
                                x * BLOCK_SIZE + 1,
                                y * BLOCK_SIZE + 1,
                                BLOCK_SIZE - 2,
                                BLOCK_SIZE - 2
                            );

                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                            this.ctx.fillRect(
                                x * BLOCK_SIZE + BLOCK_SIZE * 0.25,
                                y * BLOCK_SIZE + BLOCK_SIZE * 0.25,
                                BLOCK_SIZE * 0.5,
                                BLOCK_SIZE * 0.5
                            );
                            this.ctx.shadowBlur = 0;
                        }
                    }
                }

                // Draw current piece
                if (this.currentPiece) {
                    this.currentPiece.draw(this.ctx);
                }
            }

            drawNextPiece() {
                this.nextCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);

                if (this.nextPiece) {
                    const tempPiece = new Tetromino(this.nextPiece.shape, this.nextPiece.color);
                    tempPiece.x = (4 - tempPiece.shape[0].length) / 2;
                    tempPiece.y = tempPiece.shape.length;

                    tempPiece.shape.forEach((row, y) => {
                        row.forEach((value, x) => {
                            if (value) {
                                const drawX = (tempPiece.x + x) * BLOCK_SIZE;
                                const drawY = (tempPiece.y - y) * BLOCK_SIZE;

                                this.nextCtx.shadowBlur = 15;
                                this.nextCtx.shadowColor = tempPiece.color;
                                this.nextCtx.fillStyle = tempPiece.color;
                                this.nextCtx.fillRect(drawX + 1, drawY + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

                                this.nextCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                                this.nextCtx.fillRect(
                                    drawX + BLOCK_SIZE * 0.25,
                                    drawY + BLOCK_SIZE * 0.25,
                                    BLOCK_SIZE * 0.5,
                                    BLOCK_SIZE * 0.5
                                );
                                this.nextCtx.shadowBlur = 0;
                            }
                        });
                    });
                }
            }

            placePiece() {
                this.currentPiece.shape.forEach((row, dy) => {
                    row.forEach((value, dx) => {
                        if (value) {
                            const boardY = this.currentPiece.y - dy;
                            const boardX = this.currentPiece.x + dx;
                            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                                this.board[boardY][boardX] = this.currentPiece.color;
                            }
                        }
                    });
                });

                this.clearLines();
                this.currentPiece = this.nextPiece;
                this.nextPiece = this.createPiece();
                this.drawNextPiece();

                if (this.currentPiece.collides(this.board)) {
                    this.endGame();
                }
            }

            clearLines() {
                let linesCleared = 0;

                // Check from top to bottom and remove full lines
                for (let y = 0; y < ROWS; y++) {
                    if (this.board[y].every(cell => cell !== 0)) {
                        // Remove the full line
                        this.board.splice(y, 1);
                        // Add empty line at the BOTTOM (end of array)
                        this.board.push(Array(COLS).fill(0));
                        linesCleared++;
                        y--; // Check this index again since rows shifted up
                    }
                }

                if (linesCleared > 0) {
                    this.lines += linesCleared;
                    const points = [0, 100, 300, 500, 800][linesCleared] || 800;
                    this.score += points * this.level;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 50);
                    this.updateStats();
                }
            }

            hardRise() {
                let distance = 0;
                while (this.currentPiece.moveUp(this.board)) {
                    distance++;
                }
                if (distance > 0) {
                    this.score += distance * 2;
                    this.updateStats();
                }
                this.placePiece();
                this.dropCounter = 0;
                this.drawBoard();
            }

            updateStats() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('lines').textContent = this.lines;
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalLevel').textContent = this.level;
                document.getElementById('gameOver').classList.add('show');
            }

            restart() {
                this.reset();
                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            togglePause() {
                if (!this.gameOver) {
                    this.isPaused = !this.isPaused;
                    if (!this.isPaused) {
                        this.lastTime = performance.now();
                        requestAnimationFrame((time) => this.gameLoop(time));
                    }
                }
            }

            gameLoop(time) {
                if (this.gameOver || this.isPaused) return;

                const deltaTime = time - this.lastTime;
                this.lastTime = time;
                this.dropCounter += deltaTime;

                if (this.dropCounter > this.dropInterval) {
                    if (!this.currentPiece.moveUp(this.board)) {
                        this.placePiece();
                    }
                    this.dropCounter = 0;
                }

                this.drawBoard();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver || this.isPaused) {
                        if (e.key === 'p' || e.key === 'P') {
                            this.togglePause();
                        }
                        return;
                    }

                    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                        e.preventDefault();
                    }

                    switch(e.key) {
                        case 'ArrowLeft':
                            this.currentPiece.move(-1, this.board);
                            this.drawBoard();
                            break;
                        case 'ArrowRight':
                            this.currentPiece.move(1, this.board);
                            this.drawBoard();
                            break;
                        case 'ArrowUp':
                            this.currentPiece.rotate();
                            this.drawBoard();
                            break;
                        case 'ArrowDown':
                            if (this.currentPiece.moveUp(this.board)) {
                                this.score += 1;
                                this.updateStats();
                            }
                            this.dropCounter = 0;
                            this.drawBoard();
                            break;
                        case ' ':
                            this.hardRise();
                            break;
                        case 'p':
                        case 'P':
                            this.togglePause();
                            break;
                    }
                });

                // Touch controls for mobile
                let touchStartX = 0;
                let touchStartY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });

                this.canvas.addEventListener('touchend', (e) => {
                    if (this.gameOver || this.isPaused) return;

                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 30) {
                            this.currentPiece.move(1, this.board);
                        } else if (dx < -30) {
                            this.currentPiece.move(-1, this.board);
                        }
                    } else {
                        if (dy < -30) {
                            this.currentPiece.rotate();
                        } else if (dy > 30) {
                            if (this.currentPiece.moveUp(this.board)) {
                                this.score += 1;
                                this.updateStats();
                            }
                        }
                    }
                    this.drawBoard();
                });
            }

            start() {
                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }
        }

        // Initialize and start the game
        const game = new Game();
        game.start();
    </script>
</body>
</html>
